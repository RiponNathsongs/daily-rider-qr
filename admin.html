<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin • Daily Rider ID & QR</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Private administration page for Daily Rider ID & QR.">
  <link rel="icon" type="image/svg+xml" href="favicon-admin.svg">
  <link rel="stylesheet" href="style.css?v=20261026-comments1">
</head>
<body class="admin-body">
  <div id="loginView" class="login-page">
    <button id="loginThemeToggle" class="theme-toggle admin-theme-toggle" type="button" aria-pressed="false">☀️ White Mode</button>
    <div class="login-glow glow-one"></div>
    <div class="login-glow glow-two"></div>
    <div class="login-card">
      <div class="login-logo">DR<span>QR</span></div>
      <div class="eyebrow">PRIVATE ADMIN AREA</div>
      <h1>Welcome back</h1>
      <p>Sign in to manage riders and today's IDs.</p>
      <form id="loginForm">
        <label>Email</label>
        <input id="email" type="email" autocomplete="username" required placeholder="Admin email">
        <label>Password</label>
        <input id="password" type="password" autocomplete="current-password" required placeholder="Password">
        <button class="primary-btn full" type="submit">Secure Login</button>
        <div id="loginError" class="error-text"></div>
      </form>
      <a class="back-link" href="index.html">← Back to public page</a>
    </div>
  </div>

  <div id="dashboardView" class="hidden">
    <header class="topbar">
      <div>
        <div class="brand">Admin <span>Control Center</span></div>
        <div class="tagline">Riders • Daily IDs • QR</div>
      </div>
      <div class="admin-header-actions">
        <button id="dashboardThemeToggle" class="theme-toggle" type="button" aria-pressed="false">☀️ White Mode</button>
        <button id="logoutBtn" class="admin-link">Logout</button>
      </div>
    </header>

    <main class="container">
      <div class="dashboard-grid">
        <section class="panel">
          <div class="panel-head"><h2>Add Rider</h2></div>
          <form id="riderForm" class="form-grid">
            <input id="riderName" required placeholder="Rider name">
            <button class="primary-btn" type="submit">Add Rider</button>
          </form>
          <div id="riderMessage" class="success-text"></div>
        </section>

        <section class="panel">
          <div class="panel-head"><h2>Add Daily ID</h2></div>
          <form id="idForm" class="form-grid">
            <textarea id="dailyId" class="bulk-id-input" required rows="6" placeholder="Paste one or many IDs here.&#10;Example:&#10;DK061026JZ4CYV&#10;DL0610265U6U5M&#10;DB0610264G27EM"></textarea>
            <select id="riderSelect" required>
              <option value="">Select rider</option>
            </select>
            <button class="primary-btn" type="submit">Add ID + QR</button>
          </form>
          <div id="idMessage" class="success-text"></div>
        </section>

        <section class="panel wide">
          <div class="panel-head">
            <h2>Today's IDs</h2>
            <span id="adminDate" class="date-pill"></span>
          </div>
          <div id="adminIds" class="admin-list"></div>
        </section>

        <section class="panel wide"><div class="panel-head"><div><h2>Comment Moderation</h2><p class="comments-subtitle">Approve comments to publish them, or hide/delete them.</p></div></div><div id="adminComments" class="admin-list"><div class="empty">Loading comments…</div></div></section>

        <section class="panel wide">
          <div class="panel-head"><h2>Rider Management</h2></div>
          <div id="riderList" class="admin-list"></div>
        </section>
      </div>
    </main>
  </div>

  <script>
    (() => {
      const buttons = [document.getElementById("loginThemeToggle"), document.getElementById("dashboardThemeToggle")].filter(Boolean);
      const applyTheme = light => {
        document.body.classList.toggle("light-mode", light);
        buttons.forEach(button => {
          button.textContent = light ? "🌙 Black Mode" : "☀️ White Mode";
          button.setAttribute("aria-pressed", String(light));
        });
      };
      let saved = null;
      try { saved = localStorage.getItem("drqr-theme"); } catch (_) {}
      applyTheme(saved === "light");
      buttons.forEach(button => button.addEventListener("click", () => {
        const light = !document.body.classList.contains("light-mode");
        applyTheme(light);
        try { localStorage.setItem("drqr-theme", light ? "light" : "dark"); } catch (_) {}
      }));
    })();
  </script>
  <script type="module" src="admin.js"></script>
</body>
</html>
